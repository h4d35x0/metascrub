[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# DISTRIBUTION NAME vs COMMAND NAME.
#
# The PyPI name is "scrubproof" because "metascrub" and "metadata-scrubber" are
# both already taken on PyPI, by unrelated image-only tools. That is a hazard
# worth stating: `pip install metascrub` installs SOMEONE ELSE'S package, not
# this one. The README says so too.
#
# The command stays `metascrub`, and `scrubproof` is installed as an alias so
# that whichever name someone remembers, it works.
name = "scrubproof"
# The version lives in ONE place: metascrub/__init__.py. setuptools reads it
# from there, so the two can no longer disagree.
#
# It was declared in both files until 2026-09-05, and the 1.0.1 bump changed one
# and not the other on the first attempt. A test caught that, but a test catches
# drift after it happens; this prevents it. __init__.py is the source rather
# than pyproject because this project is designed to run from a source tree with
# no install at all (see bin/), where importlib.metadata has nothing to read.
dynamic = ["version"]
description = "Removes metadata from 71 file formats and proves it by searching the output bytes"
readme = "README.md"
# 3.10, not 3.9. Measured 2026-09-05 against the dependency metadata:
# pikepdf and Pillow both declare requires-python >=3.10, so a 3.9 install
# either fails to resolve or silently pins ancient versions nothing here
# has ever been tested against. The old ">=3.9" was an unmeasured claim.
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = [
    "metadata", "privacy", "exif", "metadata-removal", "opsec",
    "pdf", "docx", "odf", "sanitize", "redaction", "anonymity",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "pyexiftool>=0.5.6",
    "Pillow>=10.0",
    "pikepdf>=8.0",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    # Legacy OLE2 compound files (.doc/.xls/.ppt). Pure Python, no binary
    # dependency, and the only library here that can rewrite a stream inside a
    # compound file without rebuilding the container.
    "olefile>=0.47",
]

[project.urls]
Homepage = "https://github.com/h4d35x0/metascrub"
Repository = "https://github.com/h4d35x0/metascrub"
Issues = "https://github.com/h4d35x0/metascrub/issues"

[project.scripts]
metascrub = "metascrub.cli:main"
# Alias, so `pip install scrubproof` gives a command matching the name people
# saw on PyPI. Both entry points run the same CLI.
scrubproof = "metascrub.cli:main"

# GUI entry point. Listed under gui-scripts rather than scripts so that on
# Windows it is launched by pythonw.exe and does not open a console window
# behind the desktop window.
[project.gui-scripts]
metascrub-gui = "metascrub.gui:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "tkinterdnd2>=0.4"]

# Drag and drop for the desktop window. An extra rather than a core dependency
# because the CLI does not need it and a headless machine cannot use it: the
# window degrades to its Add Files / Add Folder buttons when it is absent.
# requirements.txt installs it, since that file is the desktop install path.
gui = ["tkinterdnd2>=0.4"]

[tool.setuptools.dynamic]
version = {attr = "metascrub.__version__"}

[tool.setuptools.packages.find]
include = ["metascrub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
